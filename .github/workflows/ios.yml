name: iOS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned iOS device IPA
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build for generic iPhoneOS
        run: |
          xcodebuild \
            -project iOS/WeatherApp.xcodeproj \
            -scheme Windy \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/Windy.app"
          PACKAGE_DIR="$RUNNER_TEMP/MuznIPA"
          VERIFY_DIR="$RUNNER_TEMP/MuznIPAVerify"
          IPA_PATH="$GITHUB_WORKSPACE/Muzn-unsigned.ipa"

          test -d "$APP_PATH"
          rm -rf "$PACKAGE_DIR" "$VERIFY_DIR" "$IPA_PATH"
          mkdir -p "$PACKAGE_DIR/Payload"
          /usr/bin/ditto "$APP_PATH" "$PACKAGE_DIR/Payload/Windy.app"
          (cd "$PACKAGE_DIR" && /usr/bin/zip -qry "$IPA_PATH" Payload)
          /usr/bin/unzip -q "$IPA_PATH" -d "$VERIFY_DIR"
          test -f "$VERIFY_DIR/Payload/Windy.app/Info.plist"
          plutil -lint "$VERIFY_DIR/Payload/Windy.app/Info.plist"

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Muzn-iOS-unsigned-ipa
          path: Muzn-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
